# SonarQube scan config — Croar frontend.
# Only the application source (src/) is analyzed; build output, deps and test scratch excluded.
sonar.projectKey=croar-frontend
sonar.projectName=Croar Frontend
sonar.sources=src

sonar.exclusions=\
  **/node_modules/**,\
  .next/**,\
  out/**,\
  build/**,\
  public/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  pw_crawl.js

# Point coverage/tests here if you add them later.
sonar.tests=
